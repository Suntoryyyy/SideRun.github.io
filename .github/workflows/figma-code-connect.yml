name: Publish Figma Code Connect

# Pushes RN snippets for mapped components to the Figma file (Dev Mode).
# Requires repository secret: FIGMA_ACCESS_TOKEN (Code Connect: Write scope).

on:
  push:
    branches: ["main"]
    paths:
      - "components/**/*.figma.tsx"
      - "components/AuthField.js"
      - "components/AuthButton.js"
      - "components/ShareCard.js"
      - "figma.config.json"
      - ".github/workflows/figma-code-connect.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish to Figma
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: |
          if [ -z "$FIGMA_ACCESS_TOKEN" ]; then
            echo "::error::Missing FIGMA_ACCESS_TOKEN repository secret."
            echo "Add a Figma personal access token (Code Connect: Write) under Settings → Secrets and variables → Actions."
            exit 1
          fi
          npm run figma:connect
